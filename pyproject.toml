[project]
name = "flowlens"
version = "0.1.0"
description = "Flow analytics for Kanban ticket streams"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2",
    "typer",
    "python-dateutil",
    "fastapi",
    "python-multipart",  # загрузка файлов через форму импорта
    "cryptography",  # шифрование токенов источников в базе
    "uvicorn[standard]",
    "httpx",
    "pyyaml",
]

[project.scripts]
flowlens = "flowlens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"flowlens.api" = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# env.py генерируется alembic: импорты обязаны идти после настройки sys.path
extend-exclude = ["migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# Браузерные тесты исключены из обычного прогона: они на порядок медленнее
# и требуют установленного chromium. Запуск: pytest tests/browser
testpaths = ["tests"]
norecursedirs = ["tests/browser"]
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning"]
markers = ["browser: сквозные проверки через настоящий браузер"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/flowlens/core"]
