services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowlens
      POSTGRES_PASSWORD: flowlens
      POSTGRES_DB: flowlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Разовая инициализация: миграции и — если база пуста — демо-данные.
  # Отдельным сервисом, а не шагом внутри app, чтобы перезапуск дашборда
  # не пересоздавал данные и не затирал то, что импортировали.
  init:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://flowlens:flowlens@db:5432/flowlens
      FLOWLENS_DEMO: ${FLOWLENS_DEMO:-1}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        alembic upgrade head
        if [ "$$FLOWLENS_DEMO" = "1" ]; then
          COUNT=$$(python -c "
        from flowlens.db import make_engine
        from sqlalchemy import text
        with make_engine().begin() as c:
            print(c.execute(text('SELECT count(*) FROM ticket')).scalar_one())
        ")
          if [ "$$COUNT" = "0" ]; then
            echo 'База пуста — заливаю демо-данные.'
            flowlens seed-demo --tickets 400 --months 8
            flowlens recompute --all
          else
            echo "В базе уже $$COUNT задач — демо-данные не трогаю."
          fi
        fi
    restart: "no"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://flowlens:flowlens@db:5432/flowlens
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ключ шифрования токенов источников. Значение по умолчанию годится
      # только для локальной пробы: на сервере задайте свой и не теряйте его —
      # при смене ключа сохранённые токены придётся вводить заново.
      FLOWLENS_SECRET_KEY: ${FLOWLENS_SECRET_KEY:-local-development-key}
      # Фоновое обновление по расписанию; выключено по умолчанию
      FLOWLENS_SCHEDULER: ${FLOWLENS_SCHEDULER:-0}
      # Локальный запуск — без пароля. На сервере уберите эту строку
      # и задайте FLOWLENS_ADMIN_USER / FLOWLENS_ADMIN_PASSWORD.
      FLOWLENS_AUTH_DISABLED: ${FLOWLENS_AUTH_DISABLED:-1}
      FLOWLENS_ADMIN_USER: ${FLOWLENS_ADMIN_USER:-}
      FLOWLENS_ADMIN_PASSWORD: ${FLOWLENS_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
